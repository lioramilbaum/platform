name: Air-gapped Deploy

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Release workflow run ID to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: air-gapped-deploy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'lioramilbaum/platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Validate selected Release run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Run ID must be numeric'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            .path == ".github/workflows/release.yaml" and
            .status == "completed" and .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.head_branch == "main" or (.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"))) and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/release-run.json" > /dev/null
          sha=$(jq -r .head_sha "$RUNNER_TEMP/release-run.json")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable deployment harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Download selected offline package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id }}
          name: platform-airgap-linux-arm64
          path: package

      - name: Prepare independent verification key and package inputs
        env:
          OCM_VERIFY_KEY: ${{ secrets.OCM_VERIFY_KEY }}
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$OCM_VERIFY_KEY" ]] || { echo '::error::Set independent OCM_VERIFY_KEY secret'; exit 1; }
          umask 077
          printf '%s\n' "$OCM_VERIFY_KEY" > "$RUNNER_TEMP/trusted-public.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/trusted-public.pem" -noout
          jq -e --arg sha "$EXPECTED_SOURCE_REVISION" '
            .sourceRevision == $sha and .os == "linux" and .architecture == "arm64" and
            .rootComponent == "github.com/lioramilbaum/platform" and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"))
          ' package/metadata.json > /dev/null
          version=$(jq -r .version package/metadata.json)
          package="$PWD/package/platform-airgap-${version}-linux-arm64.tar.gz"
          [[ -f "$package" ]] || { echo '::error::Expected package missing'; exit 1; }
          echo "EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Install traffic capture tooling
        run: sudo apt-get update && sudo apt-get install -y tcpdump iptables

      - name: Deploy with kind bridge egress blocked
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.sha }}
          BUILD_DIR: ${{ runner.temp }}/offline-deploy
          KEEP_CLUSTER: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          capture="$RUNNER_TEMP/evidence/public-egress.pcap"
          comment="platform-airgap-$GITHUB_RUN_ID"
          bridge=
          capture_pid=
          stop_capture() {
            if [[ -n "$capture_pid" ]]; then
              sudo kill -INT "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
              capture_pid=
            fi
          }
          # shellcheck disable=SC2329 # Invoked by EXIT trap.
          cleanup() {
            stop_capture
            if [[ -n "$bridge" ]]; then
              sudo iptables -D DOCKER-USER -i "$bridge" ! -o "$bridge" \
                -m conntrack --ctstate NEW -m comment --comment "$comment" -j DROP 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          docker network inspect kind >/dev/null 2>&1 || docker network create kind >/dev/null
          network_id=$(docker network inspect kind --format '{{.Id}}')
          bridge="br-${network_id:0:12}"
          sudo iptables -I DOCKER-USER 1 -i "$bridge" ! -o "$bridge" \
            -m conntrack --ctstate NEW -m comment --comment "$comment" -j DROP
          sudo iptables -C DOCKER-USER -i "$bridge" ! -o "$bridge" \
            -m conntrack --ctstate NEW -m comment --comment "$comment" -j DROP
          # -Z root: Ubuntu's tcpdump drops to the unprivileged 'tcpdump' user before opening
          # the -w savefile; this flag suppresses that so the capture can write to the
          # runner-owned evidence directory (see chmod below).
          sudo tcpdump -Z root -i "$bridge" -U -w "$capture" \
            '(ip and not dst net 10.0.0.0/8 and not dst net 172.16.0.0/12 and not dst net 192.168.0.0/16 and not dst net 127.0.0.0/8 and not dst net 169.254.0.0/16 and not multicast) or (ip6 and not dst net fc00::/7 and not dst net fe80::/10 and not dst host ::1 and not multicast)' &
          capture_pid=$!
          sleep 1
          sudo kill -0 "$capture_pid"
          set +e
          bash scripts/offline-run.sh "$PACKAGE" "$RUNNER_TEMP/trusted-public.pem" \
            2>&1 | tee "$RUNNER_TEMP/evidence/offline-run.log"
          result=${PIPESTATUS[0]}
          set -e
          stop_capture
          # Evidence directory is owned by the runner; only pcap reads need sudo.
          # shellcheck disable=SC2024
          sudo tcpdump -n -r "$capture" > "$RUNNER_TEMP/evidence/public-egress.txt" 2>/dev/null
          sudo chmod a+r "$capture"
          if [[ -s "$RUNNER_TEMP/evidence/public-egress.txt" ]]; then
            echo '::error::Public traffic was attempted from the kind network'
            cat "$RUNNER_TEMP/evidence/public-egress.txt"
            result=1
          fi
          printf 'Deployment exit status: %s\n' "$result" > "$RUNNER_TEMP/evidence/summary.txt"
          exit "$result"

      - name: Collect diagnostics and clean up cluster
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker ps -a > "$RUNNER_TEMP/evidence/docker-ps.txt" 2>&1 || true
          cluster_name=$(awk '/^name:/{print $2; exit}' build/offline/deploy/kind-cluster.yaml 2>/dev/null || true)
          if [[ -n "$cluster_name" ]]; then
            for node in $(docker ps -a --filter "label=io.x-k8s.kind.cluster=$cluster_name" --format '{{.Names}}'); do
              docker logs "$node" > "$RUNNER_TEMP/evidence/$node.log" 2>&1 || true
              docker exec "$node" kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes,pods -A \
                > "$RUNNER_TEMP/evidence/$node-readiness.txt" 2>&1 || true
              docker rm -f "$node" || true
            done
          fi
          rm -f "$RUNNER_TEMP/trusted-public.pem"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-airgap-results-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 14
