name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lioramilbaum/platform'
    runs-on: macos-26
    permissions:
      contents: write
      packages: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install shellcheck && make tools

      - name: Lint
        run: make lint OCM=bin/ocm

      - name: Test
        run: make test OCM=bin/ocm

      - name: Import signing key
        env:
          OCM_SIGNING_KEY: ${{ secrets.OCM_SIGNING_KEY }}
        run: |
          if [[ -z "$OCM_SIGNING_KEY" ]]; then
            echo "::error::OCM_SIGNING_KEY secret is not set"
            exit 1
          fi
          umask 077
          echo "$OCM_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          openssl rsa -in "$RUNNER_TEMP/signing.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          echo "SIGNING_KEY=$RUNNER_TEMP/signing.pem" >> "$GITHUB_ENV"
          echo "VERIFY_KEY=$RUNNER_TEMP/public.pem" >> "$GITHUB_ENV"

      - name: Build, sign, and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}" make build sign package OCM=bin/ocm

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish component to GHCR
        env:
          OCM_REPO: oci://ghcr.io/${{ github.repository_owner }}/ocm
        run: |
          VERSION="${GITHUB_REF_NAME#v}" make publish OCM=bin/ocm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" build/release/*

      - name: Cleanup signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.pem" "$RUNNER_TEMP/public.pem"
