components:
  - name: github.com/lioramilbaum/platform
    version: ${VERSION}
    provider:
      name: github.com/lioramilbaum
    labels:
      - name: platform.lioramilbaum.github.com/tier
        value: platform
      - name: platform.lioramilbaum.github.com/source-revision
        value: ${SOURCE_REVISION}
    resources:
      - name: kind
        type: executable
        version: v0.33.0
        labels:
          # When Renovate bumps the kind version, also update the sha256sum label
          # below to match the new release. The input.path is derived automatically.
          - name: kind.lioramilbaum.github.com/sha256sum-darwin-arm64
            value: "0c8c7dbe5e23594a198b786c4bc13dacc101fa6196b0cb0b23a1ca44e61f4b4f"
          - name: kind.lioramilbaum.github.com/sha256sum-linux-arm64
            value: "20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2"
        extraIdentity:
          os: ${PLATFORM_OS}
          architecture: arm64
        input:
          type: file
          path: ./bin/dist/kind-${KIND_VERSION}-${PLATFORM_OS}-arm64
          mediaType: application/octet-stream
      - name: ocm
        type: executable
        version: v0.19.1
        labels:
          # When Renovate bumps the OCM CLI version, also update the sha256sum label below
          # AND OCM_BOOTSTRAP_SHA256_DARWIN_ARM64 in scripts/bootstrap.sh (enforced by test).
          - name: ocm.lioramilbaum.github.com/sha256sum-darwin-arm64
            value: "ae87ac4943e81396054367315395787fb7b71a697d946f8bb62de67bcb93e544"
          - name: ocm.lioramilbaum.github.com/sha256sum-linux-arm64
            value: "697e44f71ab0dbd02287c6544fa17be0c73c0a9d6e873f9a2c91fd92c9acbc86"
        extraIdentity:
          os: ${PLATFORM_OS}
          architecture: arm64
        input:
          type: file
          path: ./bin/dist/ocm-${OCM_CLI_VERSION}-${PLATFORM_OS}-arm64
          mediaType: application/octet-stream
      - name: kind-node-image
        type: blob
        version: v1.37.0
        extraIdentity:
          os: linux
          architecture: arm64
        input:
          type: file
          path: ${KIND_IMAGE_INPUT_PATH}
          mediaType: application/octet-stream
      - name: kind-cluster
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./components/kind/cluster.yaml
          mediaType: application/yaml
      # Deploy-time bundle: consumers download these to <bundle>/scripts/*.sh
      # and <bundle>/component-constructor.yaml, then run deploy.sh or bootstrap.sh.
      # Build-time scripts (build.sh, sign.sh, publish.sh, fetch-kind.sh, fetch-ocm.sh) and test harness (e2e.sh) are excluded.
      # script-bootstrap is the signed reference copy of the consumer entrypoint for zero-to-cluster bootstrapping.
      - name: component-constructor
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./component-constructor.yaml
          mediaType: application/yaml
      - name: script-lib
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./scripts/lib.sh
          mediaType: text/x-shellscript
      - name: script-verify
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./scripts/verify.sh
          mediaType: text/x-shellscript
      - name: script-kind-config
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./scripts/kind-config.sh
          mediaType: text/x-shellscript
      - name: script-kind-bin
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./scripts/kind-bin.sh
          mediaType: text/x-shellscript
      - name: script-deploy
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./scripts/deploy.sh
          mediaType: text/x-shellscript
      - name: script-bootstrap
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./scripts/bootstrap.sh
          mediaType: text/x-shellscript
